[package]
name = "mocnpub-main"
version = "0.1.0"
edition = "2024"
description = "High-performance Nostr npub vanity address miner with CUDA"
repository = "https://github.com/high-moctane/mocnpub"
license = "MIT"

[dependencies]
cudarc = { version = "0.19.4", features = ["cuda-version-from-build-system"] }
num-complex = "0.4"
image = "0.25"
secp256k1 = { version = "0.29", features = ["rand-std"] }
rand = "0.10"
bech32 = "0.11"
hex = "0.4"
clap = { version = "4.6", features = ["derive"] }
num_cpus = "1.16"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
